name: test

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macos-15 ships Xcode 16.x — required to read XcodeGen's objectVersion 77
    # project format. macos-14 (Xcode 15.4) cannot open it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test ParlanceKit
        run: xcodebuild test -scheme ParlanceKitTests -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
