name: test

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test ParlanceKit
        run: xcodebuild test -scheme ParlanceKitTests -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
